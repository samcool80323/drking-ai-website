name: Validate and deploy drking.ai

# Push to master -> quality gate -> curated dist/ + Pages Functions -> Cloudflare Pages
# production -> live checks (pages 200, /api/leads must stay 403).
# scripts/release.sh does the same locally. Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: drking-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-site.mjs
      - run: node scripts/validate-seo.mjs
      - run: python3 scripts/audit-static.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build curated bundle
        run: |
          node scripts/build-pages.mjs
          npx --yes wrangler@4 pages functions build functions --outdir .fnbuild --output-routes-path .fnbuild/_routes.json
          if head -c 200 .fnbuild/index.js | grep -q form-data; then echo "functions bundle is multipart"; exit 1; fi
          cp .fnbuild/index.js dist/_worker.js
          cp .fnbuild/_routes.json dist/_routes.json
          grep -q '/api/leads' dist/_routes.json
      - name: Deploy to Cloudflare Pages (production)
        run: npx --yes wrangler@4 pages deploy dist --project-name=drking-ai --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.event.head_commit.message || 'manual deploy' }}" --commit-dirty=true
      - name: Live checks
        run: |
          sleep 10
          fail=0
          for p in / /dentists /demo /integrations /sitemap.xml /favicon.ico; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -A Mozilla/5.0 "https://drking.ai$p"); echo "$c $p"; [ "$c" = 200 ] || fail=1
          done
          for p in /api/leads '/api/leads?limit=1'; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -A Mozilla/5.0 "https://drking.ai$p"); echo "$c $p (must be 403)"; [ "$c" = 403 ] || fail=1
          done
          exit $fail
